
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dceeff">
  <title>Our Little World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="login-container">
    <div class="flower">✿</div>

    <h1>Our Little World</h1>
    <p class="subtitle">A little space for our shared memories.</p>

    <div class="login-card" id="loginCard">
      <div class="heart">♡</div>
      <h2>Welcome back!</h2>
      <p>Sign in to enter your little world.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit" id="loginButton">
          Enter Our World
        </button>
      </form>

      <p id="message" role="status"></p>
    </div>

    <div class="welcome-card hidden" id="welcomeCard">
      <div class="heart">♡</div>
      <h2>You're home!</h2>
      <p id="welcomeEmail"></p>
      <p class="coming-soon">
        Your shared little world is being prepared.
      </p>
      <button id="logoutButton">Sign Out</button>
    </div>

    <footer>Made with care · Our Little World</footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
